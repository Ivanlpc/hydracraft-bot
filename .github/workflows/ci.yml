name: Bot CI and deployment
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm audit --audit-level=moderate

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --pull --tag hydracraft-bot:ci .
      - name: Smoke test production image without network access
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /app/logs:uid=1000,gid=1000 \
            --tmpfs /app/charts:uid=1000,gid=1000 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests/docker-smoke.cjs,dst=/tmp/docker-smoke.cjs,readonly" \
            --entrypoint node hydracraft-bot:ci /tmp/docker-smoke.cjs

  deploy:
    needs: [test, image]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    concurrency:
      group: hydracraft-bot-production
      cancel-in-progress: false
    env:
      BOT_HOME: ${{ vars.BOT_HOME || '/opt/hydracraft-bot' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag hydracraft-bot:latest .
      - name: Create runtime environment
        env:
          BOT_ENV: ${{ secrets.BOT_ENV }}
        run: |
          test -n "$BOT_ENV" || { echo 'Configure the BOT_ENV secret in GitHub Actions'; exit 1; }
          umask 077
          touch "$BOT_HOME/.env"
          chmod 600 "$BOT_HOME/.env"
          printf '%s\n' "$BOT_ENV" > "$BOT_HOME/.env"
      - name: Replace container
        run: |
          if docker container inspect hydracraft-bot > /dev/null 2>&1; then
            docker stop --time 20 hydracraft-bot
            docker rm hydracraft-bot
          fi
          docker run --detach --name hydracraft-bot --restart unless-stopped \
            --init --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env-file "$BOT_HOME/.env" \
            --mount "type=bind,src=$BOT_HOME/config,dst=/app/config,readonly" \
            --mount "type=bind,src=$BOT_HOME/logs,dst=/app/logs" \
            --mount "type=bind,src=$BOT_HOME/charts,dst=/app/charts" \
            --stop-timeout 20 hydracraft-bot:latest
