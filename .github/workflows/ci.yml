name: Bot CI and deployment
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm audit --audit-level=moderate

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --pull --tag hydracraft-bot:ci .
      - name: Smoke test production image without network access
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /app/logs:uid=1000,gid=1000 \
            --tmpfs /app/charts:uid=1000,gid=1000 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests/docker-smoke.cjs,dst=/tmp/docker-smoke.cjs,readonly" \
            --entrypoint node hydracraft-bot:ci /tmp/docker-smoke.cjs

  deploy:
    needs: [test, image]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    concurrency:
      group: hydracraft-bot-production
      cancel-in-progress: false
    env:
      BOT_HOME: ${{ vars.BOT_HOME || '/opt/hydracraft-bot' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag hydracraft-bot:latest .
      - name: Prepare container folders
        run: |
          mkdir -p "$BOT_HOME/config" "$BOT_HOME/logs" "$BOT_HOME/charts"
          chmod 755 "$BOT_HOME" "$BOT_HOME/config"
          for file in config/*.json; do
            if [ ! -e "$BOT_HOME/$file" ]; then
              install -m 644 "$file" "$BOT_HOME/$file"
            fi
          done
          docker run --rm --network none --user 0 \
            --mount "type=bind,src=$BOT_HOME/logs,dst=/data/logs" \
            --mount "type=bind,src=$BOT_HOME/charts,dst=/data/charts" \
            --entrypoint chown hydracraft-bot:latest 1000:1000 /data/logs /data/charts
      - name: Create runtime environment
        shell: bash
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          TEBEX_TOKEN: ${{ secrets.TEBEX_TOKEN }}
          AGENT_PROXY_URL: ${{ secrets.AGENT_PROXY_URL }}
          AGENT_PROXY_ID: ${{ secrets.AGENT_PROXY_ID }}
          AGENT_PROXY_PROCESS_ID: ${{ secrets.AGENT_PROXY_PROCESS_ID }}
          AGENT_PROXY_JWT_SECRET: ${{ secrets.AGENT_PROXY_JWT_SECRET }}
          AGENT_PROXY_ORIGIN: ${{ secrets.AGENT_PROXY_ORIGIN }}
          AGENT_JWT_ISSUER: ${{ secrets.AGENT_JWT_ISSUER }}
          AGENT_JWT_AUDIENCE: ${{ secrets.AGENT_JWT_AUDIENCE || 'java-node-agent' }}
          AGENT_JWT_SUBJECT: ${{ secrets.AGENT_JWT_SUBJECT || 'hydracraft-bot' }}
          AGENT_TIMEOUT_MS: ${{ secrets.AGENT_TIMEOUT_MS || '10000' }}
          WEBHOOK_ACTION: ${{ secrets.WEBHOOK_ACTION }}
          WEBHOOK_UNBAN: ${{ secrets.WEBHOOK_UNBAN }}
          WEBHOOK_UNBAN2: ${{ secrets.WEBHOOK_UNBAN2 }}
          WEBHOOK_RANK: ${{ secrets.WEBHOOK_RANK }}
          WEBHOOK_UNMUTE: ${{ secrets.WEBHOOK_UNMUTE }}
          WEBHOOK_UNMUTE2: ${{ secrets.WEBHOOK_UNMUTE2 }}
          WEBHOOK_PERM: ${{ secrets.WEBHOOK_PERM }}
          WEBHOOK_HISTORY: ${{ secrets.WEBHOOK_HISTORY }}
          WEBHOOK_CHANGEPASSWORD: ${{ secrets.WEBHOOK_CHANGEPASSWORD }}
          WEBHOOK_FIXPREMIUM: ${{ secrets.WEBHOOK_FIXPREMIUM }}
          WEBHOOK_MERGEPREMIUM: ${{ secrets.WEBHOOK_MERGEPREMIUM }}
          WEBHOOK_NICKNAME_UPDATE: ${{ secrets.WEBHOOK_NICKNAME_UPDATE }}
          WEBHOOK_VOTES: ${{ secrets.WEBHOOK_VOTES }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          test -n "$TOKEN" || { echo 'Configure the TOKEN secret in GitHub Actions'; exit 1; }
          umask 077
          touch "$BOT_HOME/.env"
          chmod 600 "$BOT_HOME/.env"
          for key in TOKEN CLIENT_ID GUILD_ID TEBEX_TOKEN AGENT_PROXY_URL AGENT_PROXY_ID AGENT_PROXY_PROCESS_ID AGENT_PROXY_JWT_SECRET AGENT_PROXY_ORIGIN AGENT_JWT_ISSUER AGENT_JWT_AUDIENCE AGENT_JWT_SUBJECT AGENT_TIMEOUT_MS WEBHOOK_ACTION WEBHOOK_UNBAN WEBHOOK_UNBAN2 WEBHOOK_RANK WEBHOOK_UNMUTE WEBHOOK_UNMUTE2 WEBHOOK_PERM WEBHOOK_HISTORY WEBHOOK_CHANGEPASSWORD WEBHOOK_FIXPREMIUM WEBHOOK_MERGEPREMIUM WEBHOOK_NICKNAME_UPDATE WEBHOOK_VOTES DATABASE_HOST DATABASE_USER DATABASE_PASSWORD; do
            printf '%s=%s\n' "$key" "${!key}"
          done > "$BOT_HOME/.env"
      - name: Replace container
        run: |
          if docker container inspect hydracraft-bot > /dev/null 2>&1; then
            docker stop --time 20 hydracraft-bot
            docker rm hydracraft-bot
          fi
          docker run --detach --name hydracraft-bot --restart unless-stopped \
            --init --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env-file "$BOT_HOME/.env" \
            --mount "type=bind,src=$BOT_HOME/config,dst=/app/config,readonly" \
            --mount "type=bind,src=$BOT_HOME/logs,dst=/app/logs" \
            --mount "type=bind,src=$BOT_HOME/charts,dst=/app/charts" \
            --stop-timeout 20 hydracraft-bot:latest
